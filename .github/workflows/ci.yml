name: Build integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify committed bundle and all page builds
        run: pnpm run check
      - name: Build production and debug bundles
        run: |
          pnpm run build
          pnpm run build:debug
      - name: Ensure rebuilding leaves production unchanged
        run: git diff --exit-code -- BroadcastListScript.js
      - name: Ensure local outputs are not tracked
        shell: pwsh
        run: |
          $trackedLocalFiles = @(git ls-files -- tests docs .local debug verification node_modules .pnpm-store)
          if ($trackedLocalFiles.Count -gt 0) {
            $trackedLocalFiles
            throw 'Private tests, local history, legacy documentation or generated temporary outputs are tracked.'
          }
      - name: Save build integrity report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-integrity
          path: verification/build-check.json
          if-no-files-found: ignore
          retention-days: 14
